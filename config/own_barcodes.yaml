# Which barcodes count as "our own"?
#
# The target list shows "own" and "other" barcodes separately. A barcode is
# counted as own when its BOLD record belongs to one of the projects or
# datasets listed below, OR was deposited by one of the listed institutions.
# All other barcodes count as "other".
#
# How to change it:
#   - Project and dataset codes are the short codes BOLD shows for a
#     project or dataset, for example "BGENL" or "DS-BGE001".
#   - Institution names must be written exactly as BOLD spells them in the
#     "Institution storing" field.
#   - Leave a list empty ([]) if you do not want to use it.
#
# "Own" means: produced by the BGE project (decided 5 November 2026).
# The project codes below are those in the BGE container on BOLD, taken
# from the container export in gaplist-data (May 2025). If BGE projects
# have been added to the container since, add their codes here.

projects:
  - ALPFU
  - BBIOP
  - BCEMI
  - BGEGR
  - BGENL
  - BGEPL
  - BGETR
  - BGLIB
  - BGSND
  - BGSNH
  - BGSNL
  - BHNHM
  - BIOSC
  - BSCRO
  - BSNHM
  - BSNTN
  - BSUIO
  - DTAUT
  - DTBIO
  - DTKNU
  - DTULO
  - EBGEP
  - ILECA
  - INVBG
  - MEAMP
  - MUSBA
  - NHMCG
  - UMBGE
  - UNIFI

institutions: []
