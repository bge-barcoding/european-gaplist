# Which countries count as "Europe"?
#
# This is a political definition, not a geographic one. A species counts as
# occurring in Europe when there is evidence for it from at least one of the
# countries listed under "include".
#
# How to change it:
#   - To add a country, add a line with "- " followed by its two-letter
#     ISO 3166-1 code. The text after "#" is only a reminder for people
#     and is ignored by the pipeline.
#   - To remove a country, delete its line, or put "#" at the start of it.
#   - Codes must be in capital letters. Look them up at
#     https://www.iso.org/obp/ui/#search (choose "Country codes").
#
# Notes:
#   - Territories with their own code (such as Greenland, GL, or French
#     Guiana, GF) are separate from their mother country. They are only
#     included if listed here.
#   - Islands that share their country's code are included with it: the
#     Canary Islands with Spain, the Azores and Madeira with Portugal.
#   - Records from a country's coastal waters carry that country's code,
#     so marine species are covered too.

include:
  # EU member states
  - AT  # Austria
  - BE  # Belgium
  - BG  # Bulgaria
  - HR  # Croatia
  - CY  # Cyprus
  - CZ  # Czechia
  - DK  # Denmark
  - EE  # Estonia
  - FI  # Finland
  - AX  # Åland
  - FR  # France (metropolitan; overseas regions have their own codes)
  - DE  # Germany
  - GR  # Greece
  - HU  # Hungary
  - IE  # Ireland
  - IT  # Italy
  - LV  # Latvia
  - LT  # Lithuania
  - LU  # Luxembourg
  - MT  # Malta
  - NL  # Netherlands
  - PL  # Poland
  - PT  # Portugal (includes the Azores and Madeira)
  - RO  # Romania
  - SK  # Slovakia
  - SI  # Slovenia
  - ES  # Spain (includes the Canary Islands)
  - SE  # Sweden

  # Rest of Europe
  - AL  # Albania
  - AD  # Andorra
  - BY  # Belarus
  - BA  # Bosnia and Herzegovina
  - FO  # Faroe Islands
  - GI  # Gibraltar
  - GG  # Guernsey
  - IS  # Iceland
  - IM  # Isle of Man
  - JE  # Jersey
  - XK  # Kosovo
  - LI  # Liechtenstein
  - MD  # Moldova
  - MC  # Monaco
  - ME  # Montenegro
  - MK  # North Macedonia
  - NO  # Norway
  - SJ  # Svalbard and Jan Mayen
  - SM  # San Marino
  - RS  # Serbia
  - CH  # Switzerland
  - UA  # Ukraine
  - GB  # United Kingdom
  - VA  # Vatican City

  # Beyond geographic Europe
  - AM  # Armenia
  - GE  # Georgia
  - TR  # Turkey

# Deliberately left out:
#   RU (Russia), AZ (Azerbaijan), KZ (Kazakhstan), GL (Greenland),
#   and EU outermost regions such as GF, RE, GP, MQ and YT.
